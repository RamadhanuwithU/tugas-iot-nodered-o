<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - REST API & WebSocket</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 28px; }
        #alert-banner {
            display: none; background: #dc3545; color: white; padding: 15px 20px;
            border-radius: 10px; margin-bottom: 20px; font-weight: bold; text-align: center;
            box-shadow: 0 5px 15px rgba(220,53,69,0.4);
        }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
        .card .unit { font-size: 18px; color: #aaa; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .status-online { background: #d4edda; color: #155724; }
        .status-offline { background: #f8d7da; color: #721c24; }
        .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
        .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; }
        .btn-on { background: #28a745; }
        .btn-off { background: #dc3545; }
        .btn-primary { background: #667eea; }
        input[type="number"] { padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; width: 120px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
        #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
        #log .error { color: #f66; }
        #log .info { color: #6af; }
        #log .warn { color: #ff0; }
    </style>
</head>
<body>
<div class="container">
    <h1>IoT Dashboard — REST API & WebSocket</h1>

    <!-- Alert Banner (Tugas 1) -->
    <div id="alert-banner"></div>

    <!-- Kartu Sensor -->
    <div class="cards">
        <div class="card">
            <div class="label">Suhu</div>
            <div class="value" id="suhu">--</div>
            <div class="unit">°C</div>
        </div>
        <div class="card">
            <div class="label">Kelembaban</div>
            <div class="value" id="kelembaban">--</div>
            <div class="unit">%</div>
        </div>
        <div class="card">
            <div class="label">Status WebSocket</div>
            <div class="value" style="font-size:22px;">
                <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
            </div>
        </div>
    </div>

    <!-- Grafik Real-time (Tugas 2) -->
    <div class="panel">
        <h2>Grafik Real-Time Suhu & Kelembaban</h2>
        <canvas id="sensorChart" height="100"></canvas>
    </div>

    <!-- Kontrol & Threshold (Tugas 1) -->
    <div class="panel">
        <h2>Kontrol Perangkat & Batas Suhu</h2>
        <div class="controls">
            <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
            <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
            <input type="number" id="threshold-input" value="30" step="0.5" placeholder="Batas °C">
            <button class="btn btn-primary" onclick="setThreshold()">Set Batas Suhu</button>
        </div>
    </div>

    <!-- History (Tugas 5) -->
    <div class="panel">
        <h2>10 Data Sensor Terakhir (SQLite)</h2>
        <table>
            <thead>
                <tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Log -->
    <div class="panel">
        <h2>Log Aktivitas</h2>
        <div id="log"></div>
    </div>
</div>

<script>
const API_BASE = 'http://localhost:1880/api';
const WS_URL = 'ws://localhost:1880/ws/sensor';
const API_KEY = 'iot-secret-123'; // Tugas 3: X-API-Key

let historyData = [];

function log(msg, type = 'info') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
}

// ==============================
// CHART.JS SETUP (Tugas 2)
// ==============================
const ctx = document.getElementById('sensorChart').getContext('2d');
const sensorChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            { label: 'Suhu (°C)', data: [], borderColor: '#dc3545', backgroundColor: 'rgba(220,53,69,0.1)', tension: 0.3 },
            { label: 'Kelembaban (%)', data: [], borderColor: '#667eea', backgroundColor: 'rgba(102,126,234,0.1)', tension: 0.3 }
        ]
    },
    options: { responsive: true, animation: false }
});

function addPointToChart(d) {
    const timeLabel = new Date(d.received).toLocaleTimeString();
    sensorChart.data.labels.push(timeLabel);
    sensorChart.data.datasets[0].data.push(d.suhu);
    sensorChart.data.datasets[1].data.push(d.kelembaban);

    if (sensorChart.data.labels.length > 20) {
        sensorChart.data.labels.shift();
        sensorChart.data.datasets[0].data.shift();
        sensorChart.data.datasets[1].data.shift();
    }
    sensorChart.update();
}

function renderHistoryTable() {
    const tbody = document.getElementById('history-body');
    if (historyData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
        return;
    }
    tbody.innerHTML = historyData.slice(-10).reverse().map(d => `
        <tr>
            <td>${new Date(d.received).toLocaleTimeString()}</td>
            <td>${d.suhu}</td>
            <td>${d.kelembaban}</td>
        </tr>
    `).join('');
}

// ==============================
// LOAD INITIAL HISTORY (Tugas 3 & 5)
// ==============================
async function loadInitialHistory() {
    try {
        const res = await fetch(`${API_BASE}/history`, {
            headers: { 'X-API-Key': API_KEY }
        });
        const json = await res.json();
        if (json.status === 'success' && json.data) {
            historyData = json.data;
            renderHistoryTable();
            historyData.slice(-20).forEach(addPointToChart);
            log(`Memuat ${historyData.length} data history dari SQLite`, 'info');
        }
    } catch (err) {
        log(`Gagal fetch history: ${err.message}`, 'error');
    }
}

// ==============================
// SET THRESHOLD (Tugas 1)
// ==============================
async function setThreshold() {
    const threshold = parseFloat(document.getElementById('threshold-input').value);
    try {
        const res = await fetch(`${API_BASE}/threshold`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-API-Key': API_KEY
            },
            body: JSON.stringify({ threshold })
        });
        const json = await res.json();
        if (json.status === 'success') {
            log(`✓ Batas suhu diatur ke ${json.threshold}°C`, 'info');
        } else {
            log(`✗ Gagal set threshold: ${json.message}`, 'error');
        }
    } catch (err) {
        log(`✗ Error threshold: ${err.message}`, 'error');
    }
}

// ==============================
// KONTROL LAMPU (POST + X-API-Key)
// ==============================
async function kontrol(device, action) {
    try {
        const res = await fetch(`${API_BASE}/kontrol`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-API-Key': API_KEY
            },
            body: JSON.stringify({ device, action })
        });
        const json = await res.json();
        if (json.status === 'success') {
            log(`✓ Perintah terkirim: ${device} → ${action}`, 'info');
        } else {
            log(`✗ Gagal: ${json.message}`, 'error');
        }
    } catch (err) {
        log(`✗ Error kontrol: ${err.message}`, 'error');
    }
}

// ==============================
// WEBSOCKET REAL-TIME (Tugas 4)
// ==============================
function connectWebSocket() {
    const ws = new WebSocket(WS_URL);
    const badge = document.getElementById('status-badge');

    ws.onopen = () => {
        badge.textContent = 'ONLINE';
        badge.className = 'status-badge status-online';
        log('WebSocket terhubung (real-time tanpa polling)', 'info');
    };

    ws.onmessage = (event) => {
        const d = JSON.parse(event.data);
        document.getElementById('suhu').textContent = d.suhu;
        document.getElementById('kelembaban').textContent = d.kelembaban;

        // Notifikasi threshold (Tugas 1)
        const banner = document.getElementById('alert-banner');
        if (d.alert) {
            banner.textContent = d.alertMessage;
            banner.style.display = 'block';
            log(`⚠ ${d.alertMessage}`, 'warn');
        } else {
            banner.style.display = 'none';
        }

        // Update chart & table
        historyData.push(d);
        if (historyData.length > 50) historyData.shift();
        addPointToChart(d);
        renderHistoryTable();
    };

    ws.onclose = () => {
        badge.textContent = 'OFFLINE';
        badge.className = 'status-badge status-offline';
        log('WebSocket terputus, mencoba hubungkan ulang dalam 3 detik...', 'error');
        setTimeout(connectWebSocket, 3000);
    };
}

loadInitialHistory();
connectWebSocket();
</script>
</body>
</html>
